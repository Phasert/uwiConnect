<div class="dropdown app-notification-menu" id="notificationMenu" data-notifications-url="/api/notifications">
  <button type="button" class="btn btn-link app-notification-bell p-0 text-decoration-none" id="notificationBell"
          aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="notificationPanel"
          data-bs-toggle="dropdown" data-bs-auto-close="outside">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.5a5 5 0 0 0-5 5v3.2l-1.2 2.1A.8.8 0 0 0 2.5 13h11a.8.8 0 0 0 .7-1.2L13 9.7V6.5a5 5 0 0 0-5-5z" />
    </svg>
    <span class="badge rounded-pill text-bg-danger app-notification-badge d-none" id="notificationBadge" aria-hidden="true">0</span>
  </button>
  <div class="dropdown-menu dropdown-menu-end app-notification-panel p-0 shadow" id="notificationPanel" aria-labelledby="notificationBell">
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <span class="fw-semibold small">Notifications</span>
      <span class="text-body-secondary small" id="notificationCount" role="status" aria-live="polite"></span>
    </div>
    <div class="px-3 py-2 small text-body-secondary" id="notificationStatus" role="status" aria-live="polite">Loading notifications…</div>
    <ul class="list-unstyled mb-0 app-notification-list" id="notificationList" aria-label="Your notifications"></ul>
  </div>
</div>
