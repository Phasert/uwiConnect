<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}UWI Connect{% endblock %}</title>
    <meta name="description" content="UWI Connect helps alumni discover job opportunities, explore events and stay connected with the UWI alumni community.">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='img/favicon.ico')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="{{ url_for('static', path='css/app.css')}}" rel="stylesheet">
    {% block external_css %}{% endblock %}
    {% block internal_css %}{% endblock %}
</head>

<body>
    <a class="skip-link visually-hidden-focusable" href="#main-content">Skip to content</a>
    <div id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="2000">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastContent"></div>
        </div>
    </div>

    <dialog id="confirmation-dialog" class="border-0 rounded-3 shadow p-0 w-100"
        style="max-width: min(28rem, calc(100% - 2rem))"
        aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
        <form method="dialog" class="p-4">
            <h2 id="confirmation-title" class="h5"></h2>
            <p id="confirmation-message" class="mb-4"></p>
            <div class="d-flex flex-wrap justify-content-end gap-2">
                <button type="submit" class="btn btn-outline-secondary" value="cancel" autofocus>Cancel</button>
                <button type="submit" class="btn btn-danger" value="confirm" id="confirmation-action"></button>
            </div>
        </form>
    </dialog>
    <script src="{{ url_for('static', path='js/confirmation.js') }}" defer></script>
    {% block external_js %}{% endblock %}
</body>

</html>
